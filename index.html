<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Of Games</title>

    <style>
        body{
            margin:0;
            background:#121212;
            color:white;
            font-family:Arial, Helvetica, sans-serif;
            text-align:center;
        }

        header{
            background:#1f1f1f;
            padding:20px;
            font-size:35px;
            font-weight:bold;
        }

        h2{
            margin-top:40px;
        }

        .juegos{
            display:flex;
            justify-content:center;
            gap:30px;
            flex-wrap:wrap;
            margin:40px;
        }

        .juego{
            width:220px;
            height:260px;
            background:#222;
            border-radius:20px;
            transition:.25s;
            cursor:pointer;
        }

        .juego:hover{
            transform:scale(1.05);
            background:#303030;
        }

        .imagen{
            width:100%;
            height:170px;
            background:#444;
            border-radius:20px 20px 0 0;
        }

        h3{
            margin-top:20px;
        }
    </style>

</head>

<body>

<header>
🎮 Box Of Games
</header>

<h2>Próximamente</h2>

<div class="juegos">

<div class="juego">
<div class="imagen"></div>
<h3>Mi primer juego</h3>
</div>

<div class="juego">
<div class="imagen"></div>
<h3>Muy pronto...</h3>
</div>

</div>

</body>
</html>
